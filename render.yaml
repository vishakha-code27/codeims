services:
  - type: web
    name: ims-zone-demo
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Task2/Dockerfile
    dockerContext: ./Task2
    healthCheckPath: /
    autoDeployTrigger: commit
  - type: web
    name: codeb-ims
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./ims/Dockerfile
    dockerContext: ./ims
    healthCheckPath: /login
    autoDeployTrigger: commit
  - type: web
    name: codeb-portal
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./gateway/Dockerfile
    dockerContext: ./gateway
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: IMS_UPSTREAM
        value: https://codeims-8.onrender.com
      - key: TASK2_UPSTREAM
        value: https://codeims-6.onrender.com