<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${zone == null ? 'Add Zone' : 'Edit Zone'}">Manage Zone</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f6f7f9; }
        .container { max-width: 520px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
        label { display: block; margin-top: 12px; }
        input, select { width: 100%; padding: 10px; margin-top: 6px; box-sizing: border-box; }
        button { margin-top: 15px; padding: 10px 15px; background: #0b6e4f; color: white; border: none; border-radius: 6px; }
        .error { color: #a94442; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1 th:text="${zone == null ? 'Add Zone' : 'Edit Zone'}">Manage Zone</h1>
    <div th:if="${error}" class="error" th:text="${error}"></div>
    <form th:action="${formAction}" method="post">
        <label for="zoneName">Zone Name</label>
        <input id="zoneName" name="zoneName" type="text" maxlength="50" required
               th:value="${zoneName != null ? zoneName : (zone != null ? zone.zoneName : '')}">

        <label for="brandId">Brand</label>
        <select id="brandId" name="brandId" required>
            <option value="">Select a brand</option>
            <option th:each="brand : ${brands}"
                    th:value="${brand.brandId}"
                    th:text="${brand.brandName}"
                    th:selected="${selectedBrandId != null and selectedBrandId == brand.brandId}">Brand</option>
        </select>
        <p th:if="${#lists.isEmpty(brands)}">Create an active brand before adding a zone.</p>
        <button type="submit" th:disabled="${#lists.isEmpty(brands)}">Save Zone</button>
    </form>
    <p><a th:href="@{/#zones}">Back to Zone Dashboard</a></p>
</div>
</body>
</html>
