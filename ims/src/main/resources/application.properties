spring.application.name=ims
server.address=0.0.0.0
server.port=${PORT:8081}
spring.datasource.url=jdbc:sqlite:./codeb_ims.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.username=
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
ims.mail.from=${SMTP_FROM:noreply@localhost}
ims.app-url=${IMS_APP_URL:http://localhost:8081}
ims.admin.email=${IMS_ADMIN_EMAIL:}
ims.group-management-url=${IMS_GROUP_MANAGEMENT_URL:https://codeb-portal.onrender.com/task2/}
